name: Bug Report
description: Report a bug or unexpected behaviour in bpmn-io-browser-plugin
title: '[Fix]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the details below to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Where?
      description: GitLab.com, GitHub.com, a self-hosted instance, or the standalone viewer? Include the file / MR / PR URL if you can.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behaviour.
      placeholder: |
        1. ...
        2. ...
        3. Observe the following error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include logs or screenshots if relevant.
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Browser & extension version
      placeholder: Chrome 141, extension 0.1.0
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Any errors in the devtools console (filter for `[bpmn-io-browser-plugin]`)?
    validations:
      required: false
