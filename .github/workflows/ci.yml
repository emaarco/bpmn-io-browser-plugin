name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Architecture check (dependency-cruiser)
        run: npm run lint:deps

      - name: Unit tests
        run: npm test

      - name: Build extension (Chrome + Firefox)
        run: npm run build

      - name: Validate Firefox bundle (web-ext lint)
        run: npm run lint:webext -w @bpmn-io-browser-plugin/extension

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build -w @bpmn-io-browser-plugin/extension

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: packages/extension

      - name: E2E tests
        run: npm run test:e2e -w @bpmn-io-browser-plugin/extension
