name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate the store bundles without uploading to any store'
        type: boolean
        default: true
      tag:
        description: 'Release tag to publish, e.g. v0.2.1 (empty = latest release)'
        type: string
      store:
        description: 'Store to publish to'
        type: choice
        options: [all, chrome, edge, firefox]
        default: all

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs['packages/extension--tag_name'] }}
    steps:
      # A GitHub App token (not the default GITHUB_TOKEN) so release-please can
      # open the release PR — the default token is blocked from creating PRs.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # On a real release, build the store bundles and attach them to the GitHub
  # release. Publishing to the Chrome Web Store / AMO / Edge is intentionally a
  # separate, secret-gated step so this pipeline works
  # out of the box without any store credentials.
  package:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & zip (Chrome + Firefox)
        run: npm run zip -w @bpmn-io-browser-plugin/extension

      - name: Upload store bundles to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" packages/extension/.output/*.zip --clobber

      - name: Store bundles as build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-bundles
          path: packages/extension/.output/*.zip
          if-no-files-found: error
          include-hidden-files: true

  # Manual dry run (workflow_dispatch, dry_run checked): build + lint the store
  # bundles without uploading and without touching the protected environment.
  verify-bundles:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & zip (Chrome + Firefox)
        run: npm run zip -w @bpmn-io-browser-plugin/extension

      - name: Validate bundles
        run: |
          ls -la packages/extension/.output/*.zip
          npm run lint:webext -w @bpmn-io-browser-plugin/extension

  # Real upload to the stores, reviewer-gated via the `store-publishing`
  # environment. Runs on its own after a release was packaged, or manually
  # (workflow_dispatch, dry_run unchecked) to re-publish an existing release.
  # Always ships the bundles attached to the GitHub release of the tag, never a
  # fresh build of main. Each store runs only when its secrets exist, so
  # unconfigured stores (e.g. Edge before you have its keys) are skipped, and a
  # failing store does not stop the others — the job still ends red.
  # Add the credentials to the `store-publishing` environment.
  publish:
    needs: [release-please, package]
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && needs.package.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.dry_run == false && needs.package.result != 'failure')
      )
    runs-on: ubuntu-latest
    environment: store-publishing
    permissions:
      contents: read
    steps:
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve the release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: echo "tag=${TAG:-$(gh release view --json tagName --jq .tagName)}" >> "$GITHUB_OUTPUT"

      - name: Download the store bundles of the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$TAG" --pattern '*-chrome.zip' --pattern '*-firefox.zip' --dir bundles
          unzip -q bundles/*-firefox.zip -d bundles/firefox-mv3
          ls -la bundles

      - name: Detect which stores are configured
        id: stores
        env:
          STORE: ${{ inputs.store || 'all' }}
          CHROME_ID: ${{ secrets.CHROME_ID }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
        run: |
          enabled() { { [ "$STORE" = all ] || [ "$STORE" = "$1" ]; } && [ -n "$2" ] && echo true || echo false; }
          {
            echo "chrome=$(enabled chrome "$CHROME_ID")"
            echo "edge=$(enabled edge "$EDGE_PRODUCT_ID")"
            echo "firefox=$(enabled firefox "$AMO_JWT_ISSUER")"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to Chrome Web Store
        if: ${{ !cancelled() && steps.stores.outputs.chrome == 'true' }}
        env:
          CHROME_ID: ${{ secrets.CHROME_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          npx chrome-webstore-upload-cli@3 upload \
            --source "$(ls bundles/*-chrome.zip | head -n1)" \
            --extension-id "$CHROME_ID" --client-id "$CHROME_CLIENT_ID" \
            --client-secret "$CHROME_CLIENT_SECRET" --refresh-token "$CHROME_REFRESH_TOKEN" \
            --auto-publish

      - name: Publish to Edge Add-ons
        if: ${{ !cancelled() && steps.stores.outputs.edge == 'true' }}
        uses: wdzeng/edge-addon@9881f57720358040d079eaa06a4596dc9c273eb6 # v2.1.1
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: bundles/*-chrome.zip
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}

      - name: Sign & publish to Firefox AMO
        if: ${{ !cancelled() && steps.stores.outputs.firefox == 'true' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --package=web-ext@10 web-ext sign --channel listed \
            --source-dir bundles/firefox-mv3 \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
