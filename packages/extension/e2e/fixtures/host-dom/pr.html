<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Files changed · octo/flows#1</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
      }
      /* A real box so `isRendered(codeOf(root))` reads "expanded", not collapsed. */
      table[data-diff-anchor] {
        display: table;
        width: 100%;
        min-height: 120px;
      }
      .diff-body {
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <!-- The React "Files changed" experience, trimmed to the diff adapter's stable
         hooks: a `div[id^="diff-"]` whose `aria-labelledby` heading holds the file
         path, a `[data-diff-header-wrapper]`, and a `table[data-diff-anchor]` code
         table. The adapter loads base/head SHAs + the file list from `/api/v3`. -->
    <div id="files">
      <div id="diff-order-bpmn" aria-labelledby="diff-order-bpmn-heading">
        <div data-diff-header-wrapper>
          <h3 id="diff-order-bpmn-heading">flows/order.bpmn</h3>
        </div>
        <div class="diff-body">
          <table data-diff-anchor>
            <tbody>
              <tr>
                <td>&lt;bpmn:definitions/&gt;</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
