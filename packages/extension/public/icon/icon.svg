<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Prozessschritt">
  <!--
    Ein BPMN-Task (abgerundetes Rechteck) zwischen ein- und ausgehendem Fluss.
    Das ruhigste Zeichen der Serie.

    ZUM ANPASSEN:
      Hintergrundfarbe ... fill am rect id="bg"                  (aktuell #3A2B9C)
      Eckenradius ........ rx / ry am rect id="bg"               (0 = eckig, 224 = Squircle)
      Farbe .............. die drei stop-color unten
      Strichstaerke ...... stroke-width an der Gruppe id="glyph" (aktuell 76)
      Form ............... die Pfade in der Gruppe id="glyph"

    Raster wie logo-m / logo-b / logo-git: optische Mitte 512 / 512.
    Der Verlauf nutzt gradientUnits="userSpaceOnUse". Nicht auf objectBoundingBox
    umstellen: exakt waagerechte Pfade haben dann eine Bounding-Box der Hoehe 0
    und verschwinden in manchen Renderern.
  -->
  <defs>
    <linearGradient id="glyphGrad" gradientUnits="userSpaceOnUse" x1="512" y1="270" x2="512" y2="760">
      <stop offset="0"    stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FDFCFB"/>
      <stop offset="1"    stop-color="#E9E6E3"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#160D4A" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect id="bg" x="0" y="0" width="1024" height="1024" rx="0" ry="0" fill="#3A2B9C"/>

  <g id="glyph" filter="url(#soft)"
     fill="url(#glyphGrad)" stroke="url(#glyphGrad)"
     stroke-width="76" stroke-linecap="round" stroke-linejoin="round">
    <path fill="none" d="M 196 512 L 356 512"/>
    <path fill="none" d="M 668 512 L 828 512"/>
    <rect x="356" y="384" width="312" height="256" rx="72" fill="none"/>
  </g>
</svg>
